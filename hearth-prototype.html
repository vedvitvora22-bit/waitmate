                  )
                : null,
              filtered.filter((venue) => venue.id !== RESTAURANTS[0].id).map((venue, i) =>
                React.createElement(RestaurantCard, {
                  key: venue.id, venue,
                  onSelect: () => {},
                  onBookmark: toggleBookmark,
                  styleOverride: { transitionDelay: (i * 55) + 'ms', opacity: mounted ? 1 : 0, transform: mounted ? 'none' : 'translateY(10px)' },
                })
              )
            ),
            filtered.length === 0 && React.createElement(EmptyState, {
              icon: 'search-x',
              title: 'No restaurants found',
              subtitle: 'Try "biryani", "cafe", or "bakery"',
            })
          )
        )
      );
    }

    /* ---------- Menu view ---------- */
    function MenuItem({ item, onToggleCart, onToggleBookmark, bookmarked, qty, inCart }) {
      return (
        React.createElement('div', { className: 'group flex items-center gap-4 py-4 border-b border-border/60 last:border-0' },
          React.createElement('div', { className: 'relative w-20 h-20 flex-shrink-0 rounded-xl overflow-hidden border border-border bg-borderSoft' },
            React.createElement('img', {
              src: item.image, alt: item.name, className: 'w-full h-full object-cover group-hover:scale-105 transition duration-500', loading: 'lazy',
            }),
            React.createElement('span', { className: 'absolute bottom-1 left-1 w-2.5 h-2.5 rounded-full ' + (item.veg ? 'bg-veg' : 'bg-nonveg') }),
            item.popular && React.createElement('span', { className: 'absolute top-1 right-1 w-5 h-5 rounded-full bg-terracotta/90 flex items-center justify-center text-[9px] text-cream' }, React.createElement('i', { 'data-lucide': 'star', className: 'w-3 h-3' }))
          ),
          React.createElement('div', { className: 'flex-1 min-w-0' },
            React.createElement('div', { className: 'flex items-center justify-between gap-2 mb-0.5' },
              React.createElement('h4', { className: 'font-body text-sm font-semibold text-charcoal leading-none' }, item.name),
              React.createElement('span', { className: 'font-semibold text-charcoal' }, formatPrice(item.price))
            ),
            React.createElement('p', { className: 'text-xs text-muted line-clamp-1' }, item.desc),
            React.createElement('div', { className: 'flex items-center gap-2 mt-2' },
              React.createElement(DotVeg, { veg: item.veg }),
              item.spicy && React.createElement('span', { className: 'inline-flex items-center gap-0.5 rounded-full border border-terracottaSoft bg-terracottaSoft px-2 py-0.5 text-[10px] font-bold text-terracottaDark uppercase tracking-tighter' }, 'Spicy')
            )
          ),
          React.createElement('div', { className: 'flex items-center gap-2' },
            inCart
              ? React.createElement('div', { className: 'flex items-center overflow-hidden rounded-lg border border-border' },
                  React.createElement('button', {
                    className: 'w-7 h-7 flex items-center justify-center text-charcoal hover:bg-terracottaSoft transition focus:outline-none',
                  }, '–'),
                  React.createElement('span', { className: 'w-6 text-center text-xs font-semibold text-charcoal' }, qty),
                  React.createElement('button', {
                    className: 'w-7 h-7 flex items-center justify-center text-charcoal hover:bg-terracottaSoft transition focus:outline-none',
                  }, '+')
                )
              : React.createElement('button', {
                  className: 'w-9 h-9 rounded-full bg-terracotta text-cream text-xs font-bold flex items-center justify-center hover:bg-terracottaDark transition focus:outline-none focus:ring-2 focus:ring-terracotta focus:ring-offset-2 focus:ring-offset-cream',
                  'aria-label': 'Add ' + item.name,
                },
                  React.createElement('i', { 'data-lucide': 'plus', className: 'w-3.5 h-3.5' })
                )
          ),
          React.createElement('button', {
            className: 'w-7 h-7 rounded-full border border-border flex items-center justify-center text-charcoal hover:bg-terracottaSoft transition focus:outline-none focus:ring-2 focus:ring-terracotta',
            'aria-label': bookmarked ? 'Remove bookmark' : 'Bookmark',
          },
            React.createElement('i', { 'data-lucide': 'heart', className: 'w-4 h-4', style: { fill: bookmarked ? '#b45439' : 'none', stroke: bookmarked ? 'none' : 'currentColor' } })
          )
        )
      );
    }

    function MenuView() {
      const [venueId, setVenueId] = useState(null);
      const [query, setQuery] = useState('');
      const [cart, setCart] = useState({});
      const [itemBookmarks, setItemBookmarks] = useState(new Set());
      const [venueBookmark, setVenueBookmark] = useState(false);
      const [toast, setToast] = useState(null);
      const [orderPlaced, setOrderPlaced] = useState(null);
      const [activeCat, setActiveCat] = useState(null);
      const catRefs = useRef({});

      const menu = useMemo(() => venueId ? MENUS[venueId] : null, [venueId]);
      const venue = useMemo(() => RESTAURANTS.find((r) => r.id === venueId), [venueId]);

      const cartCount = useMemo(() => Object.values(cart).reduce((a, b) => a + b, 0), [cart]);
      const cartTotal = useMemo(() => {
        let total = 0;
        Object.entries(cart).forEach(([id, qty]) => { total += (ALL_ITEMS[id].price || 0) * qty; });
        return total;
      }, [cart]);

      const cartItems = useMemo(() =>
        Object.entries(cart).map(([id, qty]) => ({ item: ALL_ITEMS[id], qty })), [cart]);

      const itemsByCat = useMemo(() => {
        const map = {};
        menu && menu.categories.forEach((c) => { map[c.id] = menu.items.filter((i) => i.category === c.id); });
        return map;
      }, [menu]);

      const toggleCart = useCallback((id, delta) => {
        setCart((prev) => {
          const next = { ...prev };
          const newQty = (prev[id] || 0) + delta;
          if (newQty <= 0) delete next[id]; else next[id] = newQty;
          return next;
        });
        if (delta > 0) {
          setToast('Added ' + ALL_ITEMS[id].name);
          setTimeout(() => setToast(null), 2000);
        }
      }, []);

      const toggleItemBookmark = (id) => {
        setItemBookmarks((prev) => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      };

      const handleCheckout = () => {
        const orderId = 'H' + Math.floor(1000 + Math.random() * 9000);
        setOrderPlaced(orderId);
        setCart({});
      };

      const goBack = () => setVenueId(null);

      useEffect(() => {
        if (!menu) return;
        const observer = new IntersectionObserver((entries) => {
          const visible = entries.filter((e) => e.isIntersecting);
          if (visible.length) setActiveCat(visible[0].target.id);
        }, { threshold: 0.3, rootMargin: '-120px 0% -55% 0%' });
        Object.values(catRefs).forEach((ref) => { if (ref.current) observer.observe(ref.current); });
        return () => observer.disconnect();
      }, [menu]);

      if (!venue) return null;

      return (
        React.createElement('div', { className: 'min-h-screen bg-cream' },
          React.createElement(Toast, { message: toast }),
          orderPlaced ? (
            React.createElement('div', { className: 'fixed inset-0 z-50 flex flex-col items-center justify-center bg-cream p-6' },
              React.createElement('i', { 'data-lucide': 'check-circle-2', className: 'w-16 h-16 text-veg mb-4' }),
              React.createElement('h3', { className: 'font-display text-2xl font-bold text-charcoal mb-1' }, 'Order confirmed!'),
              React.createElement('p', { className: 'text-[11px] text-muted mb-6' }, 'Thank you. Order #' + orderPlaced + ' is being prepared at ' + venue.name + '.'),
              React.createElement('button', {
                onClick: () => { setOrderPlaced(null); },
                className: 'rounded-xl border border-border px-5 py-2 text-sm font-semibold text-charcoal hover:bg-terracottaSoft transition',
              }, 'Browse more')
            )
          ) : (
            React.createElement(React.Fragment, null,
              React.createElement('div', { className: 'sticky top-0 z-20 border-b border-border bg-cream/90 backdrop-blur-sm' },
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 py-3 flex items-center justify-between' },
                  React.createElement('button', {
                    onClick: goBack,
                    className: 'w-9 h-9 rounded-xl border border-border flex items-center justify-center text-charcoal hover:bg-terracottaSoft transition focus:outline-none focus:ring-2 focus:ring-terracotta',
                    'aria-label': 'Back',
                  },
                    React.createElement('i', { 'data-lucide': 'arrow-left', className: 'w-5 h-5' })
                  ),
                  React.createElement('div', { className: 'relative flex-1' },
                    React.createElement('input', {
                      type: 'text',
                      placeholder: 'Search menu items...',
                      value: query,
                      onChange: (e) => setQuery(e.target.value),
                      className: 'w-full pl-9 pr-3 py-2 bg-white border border-border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-terracotta/20 focus:border-terracotta transition',
                    }),
                    React.createElement('i', { 'data-lucide': 'search', className: 'absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-muted' })
                  ),
                  React.createElement('button', {
                    onClick: () => setVenueBookmark((p) => !p),
                    className: `w-9 h-9 rounded-xl border border-border flex items-center justify-center text-charcoal hover:bg-terracottaSoft transition ${venueBookmark ? 'bg-terracotta text-cream border-transparent' : ''} focus:outline-none focus:ring-2 focus:ring-terracotta`,
                    'aria-label': venueBookmark ? 'Remove bookmark' : 'Bookmark restaurant',
                  },
                    React.createElement('i', { 'data-lucide': 'heart', className: 'w-4.5 h-4.5', style: { fill: venueBookmark ? '#b45439' : 'none', stroke: venueBookmark ? 'none' : 'currentColor' } })
                  )
                )
              ),
              React.createElement('div', { className: 'relative h-56' },
                React.createElement('img', {
                  src: venue.image, alt: venue.name, className: 'w-full h-full object-cover', loading: 'lazy',
                }),
                React.createElement('div', { className: 'absolute inset-0 bg-gradient-to-t from-charcoal/85 via-charcoal/20 to-transparent' }),
                React.createElement('div', { className: 'absolute bottom-0 left-0 w-full p-6 pb-10 text-white' },
                  React.createElement('div', { className: 'flex items-end gap-2 mb-1' },
                    React.createElement('h1', { className: 'font-display text-3xl font-semibold text-white tracking-tight leading-none' }, venue.name),
                    React.createElement('span', { className: 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full border border-white/20 bg-white/10 text-[10px] font-bold text-white uppercase tracking-tighter' }, venue.price.replace(/₹/g, '₹'))
                  ),
                  React.createElement('p', { className: 'text-[#c9b9a8] text-[11px] font-medium' },
                    venue.cuisine + ' · ' + venue.distance + ' · ' + venue.delivery + ' delivery'
                  )
                )
              ),
              React.createElement('div', { className: 'sticky top-14 z-10 border-b border-border bg-cream' },
                React.createElement('div', { className: 'max-w-7xl mx-auto px-4 overflow-x-auto scrollbar-hide' },
                  React.createElement('div', { className: 'flex gap-4' },
                    menu.categories.map((cat) => {
                      const active = activeCat === cat.id;
                      return React.createElement('button', {
                        key: cat.id,
                        onClick: () => { setActiveCat(cat.id); catRefs[cat.id].current?.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
                        className: `px-3 py-2.5 border-b-2 text-sm font-semibold transition ${active ? 'border-terracotta text-charcoal' : 'border-transparent text-muted hover:bg-terracottaSoft'}`,
                      }, cat.label);
                    })
                  )
                )
              ),
              React.createElement('div', { className: 'max-w-7xl mx-auto px-4 pb-28' },
                menu.categories.map((cat) => {
                  const items = itemsByCat[cat.id].filter((i) => i.name.toLowerCase().includes(query.toLowerCase()) || i.desc.toLowerCase().includes(query.toLowerCase()));
                  if (items.length === 0) return null;
                  return (
                    React.createElement('section', {
                      key: cat.id,
                      id: cat.id,
                      ref: (el) => { catRefs[cat.id] = el; },
                      className: 'scroll-mt-[150px] mb-16',
                    },
                      React.createElement('h2', { className: 'font-display text-lg font-semibold text-charcoal mb-4 flex items-center gap-2' },
                        React.createElement('span', null, cat.label),
                        React.createElement('span', { className: 'w-6 h-0.5 bg-border shrink-0' })
                      ),
                      React.createElement('div', { className: 'grid gap-4' },
                        items.map((item) => {
                          const itemQty = cart[item.id] || 0;
                          return React.createElement(MenuItem, {
                            key: item.id, item,
                            bookmarked: itemBookmarks.has(item.id),
                            qty: itemQty,
                            inCart: itemQty > 0,
                            onToggleCart: toggleCart,
                            onToggleBookmark: toggleItemBookmark,
                          })
                        })
                      )
                    )
                  )
                }),
                query &&
                Object.values(itemsByCat).every((arr) => arr.filter((i) => i.name.toLowerCase().includes(query.toLowerCase()) || i.desc.toLowerCase().includes(query.toLowerCase())).length === 0) &&
                React.createElement(EmptyState, { icon: 'search-x', title: 'No matching items', subtitle: 'Try a different dish or ingredient' })
              ),
              React.createElement('div', { className: 'fixed bottom-0 left-0 right-0 z-40 border-t border-border bg-cream/95 backdrop-blur p-4 md:p-6 transition' },
                cartCount === 0
                  ? React.createElement('div', { className: 'p-6 text-center' },
                      React.createElement('i', { 'data-lucide': 'shopping-basket', className: 'w-10 h-10 text-soft mx-auto mb-3' }),
                      React.createElement('h3', { className: 'font-display text-lg font-semibold text-charcoal' }, 'Your cart is empty'),
                      React.createElement('p', { className: 'text-[11px] text-muted mt-1' }, 'Add items from the menu to get started')
                    )
                  : React.createElement('div', { className: 'space-y-3' },
                      React.createElement('div', { className: 'flex items-center justify-between mb-1' },
                        React.createElement('span', { className: 'font-display text-sm font-semibold text-charcoal uppercase tracking-tighter' }, 'Your order'),
                        React.createElement('span', { className: 'text-[11px] text-muted' }, cartCount + ' item' + (cartCount !== 1 ? 's' : ''))
                      ),
                      React.createElement('div', { className: 'max-h-44 overflow-y-auto pr-2 space-y-3 mb-2' },
                        cartItems.map(({ item, qty }) =>
                          React.createElement('div', { key: item.id, className: 'flex gap-2 items-center' },
                            React.createElement('img', {
                              src: item.image, alt: item.name, className: 'w-10 h-10 rounded-lg object-cover border border-border', loading: 'lazy',
                            }),
                            React.createElement('div', { className: 'flex-1 min-w-0' },
                              React.createElement('div', { className: 'flex items-center justify-between' },
                                React.createElement('span', { className: 'text-xs font-semibold text-charcoal leading-none' }, item.name),
                                React.createElement('span', { className: 'text-xs font-semibold text-charcoal' }, '×' + qty)
                              ),
                              React.createElement('span', { className: 'text-[10px] text-muted' }, formatPrice(item.price * qty))
                            ),
                            React.createElement('button', {
                              onClick: () => toggleCart(item.id, -qty),
                              className: 'w-6 h-6 rounded-full border border-border flex items-center justify-center text-[10px] text-muted hover:text-terracotta hover:bg-terracottaSoft transition',
                            }, '✕')
                          )
                        )
                      ),
                      React.createElement('div', { className: 'flex items-center justify-between mb-3 pt-3 border-t border-border' },
                        React.createElement('span', { className: 'font-display text-base font-bold text-charcoal' }, 'Total'),
                        React.createElement('span', { className: 'font-display text-base font-bold text-charcoal' }, formatPrice(cartTotal))
                      ),
                      React.createElement('button', {
                        onClick: handleCheckout,
                        className: 'w-full py-3 rounded-xl bg-terracotta text-cream font-semibold flex items-center justify-center gap-2 hover:bg-terracottaDark transition focus:outline-none focus:ring-2 focus:ring-terracotta focus:ring-offset-2 focus:ring-offset-cream',
                      },
                        React.createElement('span', null, 'Place order'),
                        React.createElement('i', { 'data-lucide': 'arrow-right', className: 'w-4 h-4' })
                      ),
                      React.createElement('p', { className: 'text-[10px] text-muted text-center mt-2' }, 'Delivery in 28–35 mins · No platform fees')
                    )
              )
            )
          )
        )
      );
    }

    /* ---------- App ---------- */
    function App() {
      const [view, setView] = useState('listing');
      return (
        React.createElement('div', { className: 'min-h-screen bg-cream' },
          view === 'listing' ? React.createElement(Listing, null) : React.createElement(MenuView, null)
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(App));

    const renderIcons = () => { if (window.lucide) window.lucide.createIcons(); };
    renderIcons();
    const obs = new MutationObserver(renderIcons);
    obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  </script>
</body>
</html>
